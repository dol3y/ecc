name: Deploy site

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # Daily rebuild so the diary's upcoming/past ride split (a build-time
    # cutoff) advances even on days with no content push. 06:00 UTC is
    # safely past midnight UK time (BST is UTC+1) so the date has rolled
    # over for users before this runs.
    - cron: "0 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PATH_PREFIX: /ecc/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
